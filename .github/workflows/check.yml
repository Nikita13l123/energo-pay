name: Checks
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: energo_pay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgre
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d energo_pay"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: bash mvnw -B verify
      - run: |
          java -jar target/electricity-billing-0.0.1-SNAPSHOT.jar --server.port=8081 > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health; then break; fi
            sleep 2
          done
          python3 tests/smoke.py
      - if: failure()
        run: cat /tmp/backend.log
