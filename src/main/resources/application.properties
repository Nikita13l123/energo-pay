spring.application.name=energo-pay

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/energo_pay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
spring.jackson.time-zone=Europe/Moscow
spring.jackson.deserialization.accept-float-as-int=false
