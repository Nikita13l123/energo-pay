name: energo-pay

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energo_pay
      POSTGRES_USER: energo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Europe/Moscow
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energo -d energo_pay"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: energo-pay-backend:demo
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/energo_pay
      DB_USERNAME: energo
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: energo-pay-web:demo
    build: ./frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  database:
